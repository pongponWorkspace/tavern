<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Tavern</title>
    <style>
      /* Boot screen: painted before any JS or CSS bundle loads; React replaces it on mount. */
      html, body { margin: 0; background: #f6f7f9; }
      .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
      .boot-bar { width: 120px; height: 3px; border-radius: 999px; background: rgb(36 71 245 / 0.14); overflow: hidden; }
      .boot-bar > span { display: block; width: 40%; height: 100%; border-radius: inherit; background: #2447f5; animation: boot-slide 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      .boot svg { animation: boot-in 240ms cubic-bezier(0.16, 1, 0.3, 1) both; }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes boot-in { from { opacity: 0; transform: scale(0.94); } }
      @media (prefers-color-scheme: dark) {
        html, body { background: #0d1015; }
        .boot-bar { background: rgb(58 91 255 / 0.2); }
        .boot-bar > span { background: #3a5bff; }
        .boot .plate { fill: #3a5bff; }      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar > span { animation-duration: 2.4s; }
        .boot svg { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Tavern">
        <svg width="40" height="40" viewBox="0 0 48 48" aria-hidden="true">
          <rect class="plate" width="48" height="48" rx="10.5" fill="#2447f5" />
          <g fill="#fff"><rect x="12" y="9" width="24" height="7" rx="3.5" /><path d="M18.6 16h10.8l-1.5 9.2h-7.8z" /><rect x="13.5" y="24.8" width="21" height="4.6" rx="2.3" /><rect x="22.6" y="29" width="2.8" height="11" rx="1.4" /></g>
        </svg>
        <div class="boot-bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
